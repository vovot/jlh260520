<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>九连环 - 中华传统益智游戏 (横屏移动端优化版)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--body);display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'SimSun','STSong','Songti SC',serif;transition:background .6s;padding:4px;overflow:hidden}
.game-container{width:100%;max-width:100%;background:linear-gradient(180deg,var(--bg1),var(--bg2));border:2px solid var(--border);border-radius:12px;padding:8px 12px;box-shadow:0 8px 40px rgba(0,0,0,.5),0 0 0 1px var(--border-inner),inset 0 1px 0 rgba(255,255,255,.08);position:relative;transition:all .6s;overflow:hidden}
.game-container::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:conic-gradient(from 0deg,transparent,var(--shimmer),transparent,transparent);animation:shimmer 8s linear infinite;opacity:.03;pointer-events:none}
@keyframes shimmer{to{transform:rotate(360deg)}}
.corner{position:absolute;width:18px;height:18px;pointer-events:none;opacity:.5;transition:border-color .6s}
.corner-tl{top:4px;left:4px;border-top:2px solid var(--corner);border-left:2px solid var(--corner);border-radius:4px 0 0 0}
.corner-tr{top:4px;right:4px;border-top:2px solid var(--corner);border-right:2px solid var(--corner);border-radius:0 4px 0 0}
.corner-bl{bottom:4px;left:4px;border-bottom:2px solid var(--corner);border-left:2px solid var(--corner);border-radius:0 0 0 4px}
.corner-br{bottom:4px;right:4px;border-bottom:2px solid var(--corner);border-right:2px solid var(--corner);border-radius:0 0 4px 0}

/* 横屏极致压缩的扁平化头部面板 */
.header-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--move-bd);flex-wrap:nowrap}
.header-left{display:flex;align-items:center;gap:6px;flex-shrink:0}
.header-left h1{font-size:18px;color:var(--title);letter-spacing:2px;font-weight:900;text-shadow:0 2px 6px var(--title-sh);transition:color .6s}
.mode-tag{display:inline-block;font-size:10px;color:var(--mode-tx);padding:1px 6px;background:var(--mode-bg);border:1px solid var(--mode-bd);border-radius:10px;letter-spacing:1px;white-space:nowrap;vertical-align:middle;transition:all .6s}

.info-bar{display:flex;align-items:center;gap:6px;flex-grow:1;justify-content:center}
.info-item{font-size:11px;color:var(--move);padding:3px 8px;background:var(--move-bg);border-radius:6px;border:1px solid var(--move-bd);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:all .6s;white-space:nowrap}
.info-item span{color:var(--move-n);font-weight:bold;font-size:13px;font-variant-numeric:tabular-nums}

.ring-select-wrap{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--move);flex-shrink:0}
.ring-select{padding:2px 6px;font-size:11px;font-family:'SimSun','STSong',serif;background:var(--move-bg);color:var(--move-n);border:1px solid var(--move-bd);border-radius:6px;cursor:pointer;outline:none;transition:all .3s;text-align:center}
.ring-select option{background:var(--bg1);color:var(--move-n)}

.canvas-wrapper{display:flex;justify-content:center;margin:4px 0}
.canvas-frame{width:100%;border:1.5px solid var(--frame);border-radius:8px;overflow:hidden;box-shadow:inset 0 0 12px rgba(0,0,0,.15),0 2px 8px rgba(0,0,0,.2);position:relative;transition:border-color .6s}
.pause-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:none;justify-content:center;align-items:center;font-size:24px;color:var(--title);letter-spacing:8px;font-family:'SimSun','STSong',serif;font-weight:bold;z-index:10;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.pause-overlay.show{display:flex}

/* 底部紧凑控制流 */
.controls{display:flex;justify-content:center;align-items:center;gap:5px;margin-top:6px;flex-wrap:wrap}
.btn{padding:4px 10px;font-size:11px;font-family:'SimSun','STSong',serif;background:var(--btn-bg);color:var(--btn-tx);border:1px solid var(--btn-bd);border-radius:6px;cursor:pointer;letter-spacing:1px;transition:all .25s;user-select:none;box-shadow:0 1px 4px rgba(0,0,0,.15);position:relative;overflow:hidden}
.btn::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);transition:left .5s}
.btn:hover::after{left:100%}
.btn:hover{box-shadow:0 2px 10px rgba(0,0,0,.25),0 0 8px var(--btn-glow);transform:translateY(-1px)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.btn:disabled::after{display:none}

.style-bar{display:flex;justify-content:center;align-items:center;gap:5px;margin-top:6px;flex-wrap:wrap}
.style-item{display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:12px;cursor:pointer;border:1.5px solid transparent;transition:all .3s;user-select:none;background:var(--style-bg)}
.style-item:hover{background:var(--style-hover)}
.style-item.active{border-color:var(--style-active);background:var(--style-hover);box-shadow:0 0 8px var(--btn-glow)}
.style-dot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(255,255,255,.15);transition:transform .3s;flex-shrink:0}
.style-name{font-size:10px;color:var(--sub);letter-spacing:1px;white-space:nowrap;transition:color .6s}

/* 弹出面板区域限制高宽防止在横屏状态溢出屏幕 */
.help-panel, .records-panel{max-height:0;overflow:hidden;transition:max-height .4s ease;margin-top:6px}
.help-panel.open, .records-panel.open{max-height:160px;overflow-y:auto}
.help-content, .records-content{background:var(--panel-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--panel-bd);border-radius:8px;padding:10px 16px;color:var(--panel-tx);line-height:1.6;transition:all .6s}
.help-content h3, .records-content h3{color:var(--panel-tt);font-size:13px;margin-bottom:4px;letter-spacing:2px}
.help-content p{font-size:11px;margin-bottom:2px}
.help-content .rule{padding-left:8px;border-left:2px solid var(--panel-rl);margin:4px 0}
.record-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--move-bd);font-size:12px;color:var(--move)}
.record-row:last-child{border-bottom:none}
.record-rank{width:24px;font-weight:bold;color:var(--move-n)}
.record-steps{flex:1;text-align:center}
.record-time{flex:1;text-align:right;font-variant-numeric:tabular-nums}
.no-records{font-size:12px;color:var(--sub);text-align:center;padding:6px 0}
.clear-btn-wrap{text-align:center;margin-top:4px}

.win-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);justify-content:center;align-items:center;z-index:100;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.win-overlay.show{display:flex}
.win-box{background:linear-gradient(180deg,var(--bg1),var(--bg2));border:2px solid var(--win-bd);border-radius:16px;padding:20px 40px;text-align:center;box-shadow:0 0 40px rgba(0,0,0,.4),0 0 20px var(--btn-glow);position:relative;overflow:hidden;max-width:90%}
.win-box h2{font-size:24px;color:var(--win-tt);letter-spacing:8px;margin-bottom:6px;text-shadow:0 2px 4px var(--title-sh)}
.win-box p{font-size:13px;color:var(--win-tx);margin-bottom:4px}
.win-box .btn{margin-top:10px}
.win-new-record{color:var(--move-n);font-size:14px;font-weight:bold;margin-top:4px;letter-spacing:2px}
.star-rating{font-size:22px;margin-bottom:6px;letter-spacing:4px}
</style>
</head>
<body>
<div class="game-container" id="gameContainer">
    <div class="corner corner-tl"></div><div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div><div class="corner corner-br"></div>
    
    <div class="header-bar">
        <div class="header-left">
            <h1 id="titleText">九 连 环</h1>
            <span class="mode-tag" id="modeTag">拆解模式</span>
        </div>
        <div class="info-bar">
            <div class="info-item">步数：<span id="moveCount">0</span> / <span id="optimalSteps">341</span></div>
            <div class="info-item">剩余：<span id="remainSteps">341</span> 步</div>
            <div class="info-item">用时：<span id="timerDisplay">00:00.000</span></div>
        </div>
        <div class="ring-select-wrap">
            <select class="ring-select" id="ringSelect">
                <option value="7">7 环</option>
                <option value="9" selected>9 环</option>
                <option value="10">10 环</option>
                <option value="15">15 环</option>
                <option value="20">20 环</option>
            </select>
        </div>
    </div>

    <div class="canvas-wrapper">
        <div class="canvas-frame">
            <canvas id="puzzle"></canvas>
            <div class="pause-overlay" id="pauseOverlay">已 暂 停</div>
        </div>
    </div>

    <div class="controls">
        <button class="btn" id="resetBtn">重置</button>
        <button class="btn" id="undoBtn" disabled>撤销</button>
        <button class="btn" id="hintBtn">提示</button>
        <button class="btn" id="pauseBtn">暂停</button>
        <button class="btn" id="modeBtn">切换安装</button>
        <button class="btn" id="solveBtn">演示</button>
        <button class="btn" id="soundBtn">音效</button>
        <button class="btn" id="helpBtn">规则</button>
        <button class="btn" id="recordsBtn">记录</button>
    </div>
    <div class="style-bar" id="styleBar"></div>

    <div class="help-panel" id="helpPanel">
        <div class="help-content">
            <h3>游 戏 规 则</h3>
            <p class="rule">第 1 环随时可以上梁或下梁。</p>
            <p class="rule">第 n 环（n＞1）上下梁条件：第 n-1 环在梁上，且第 1 至 n-2 环全在下。</p>
            <p id="helpOptimal">目标：最少需要 341 步。</p>
            <p>操作：点击圆环或使用对应数字键上/下梁，有光圈提示。</p>
        </div>
    </div>
    <div class="records-panel" id="recordsPanel">
        <div class="records-content" id="recordsContent"></div>
        <div class="clear-btn-wrap" id="clearRecordsWrap"><button class="btn" id="clearRecordsBtn" style="font-size:10px;padding:3px 10px">清除记录</button></div>
    </div>
</div>

<div class="win-overlay" id="winOverlay">
    <div class="win-box">
        <h2>恭 喜 通 关</h2>
        <div class="star-rating" id="starRating"></div>
        <p>步数：<span id="winMoves">0</span></p>
        <p>用时：<span id="winTime">00:00.000</span></p>
        <div class="win-new-record" id="winNewRecord" style="display:none">新纪录！</div>
        <button class="btn" id="winResetBtn">再来一局</button>
    </div>
</div>

<script>
(function(){
var RING_OPTIONS=[7,9,10,15,20];
var TOTAL=9;
var CANVAS_W=880,CANVAS_H=200;
var BEAM_Y=50,BEAM_H=14,BEAM_CY=BEAM_Y+BEAM_H/2;
var ON_Y=BEAM_CY,OFF_Y=140;
var ANIM_DUR=480;
var ROD_W=2;
var R_RADIUS,R_BORDER,R_SPACE,R_X0,BEAM_L,BEAM_R;
var RX=[];
var DOT_R=5;

function computeLayout(){
// 动态结合横屏宽度，微调核心算式，使得哪怕20环在窄横屏下也能完美收缩显示
R_SPACE=Math.min(92,Math.floor((CANVAS_W-60)/Math.max(TOTAL-1,1)));
R_RADIUS=Math.max(8,Math.min(24,Math.floor(R_SPACE/2.8)));
R_BORDER=Math.max(2,Math.min(6,Math.floor(R_RADIUS/4)));
DOT_R=Math.max(4,Math.min(7,Math.floor(R_RADIUS/3.5)));
BEAM_H=Math.max(10,Math.min(18,Math.floor(R_RADIUS*.78)));
BEAM_Y=Math.max(25,Math.floor(R_RADIUS*2.2+15));
BEAM_CY=BEAM_Y+BEAM_H/2;
ON_Y=BEAM_CY;
OFF_Y=ON_Y+R_RADIUS*5.5; // 压缩上下位移距离以适应极矮的手机横屏
CANVAS_H=Math.floor(OFF_Y+R_RADIUS*2.0);
ROD_W=Math.max(1,Math.min(3,Math.floor(R_RADIUS/7)));
var totalW=R_SPACE*(TOTAL-1);
R_X0=Math.floor((CANVAS_W-totalW)/2);
BEAM_L=R_X0-R_RADIUS-15;
BEAM_R=R_X0+totalW+R_RADIUS+15;
RX=[];
for(var i=0;i<TOTAL;i++)RX[i]=R_X0+i*R_SPACE;
}

function optimalSteps(n){
var a=1,b=2;
if(n===1)return 1;if(n===2)return 2;
for(var i=3;i<=n;i++){var c=b+2*a+1;a=b;b=c}
return b
}

function playBubble(up){if(!audioCtx||!soundOn)return;var now=audioCtx.currentTime;var bf=up?380:520;var ef=up?680:260;var osc=audioCtx.createOscillator();var gain=audioCtx.createGain();osc.connect(gain);gain.connect(audioCtx.destination);osc.type='sine';osc.frequency.setValueAtTime(bf,now);osc.frequency.exponentialRampToValueAtTime(ef,now+.1);gain.gain.setValueAtTime(.001,now);gain.gain.exponentialRampToValueAtTime(.08,now+.008);gain.gain.exponentialRampToValueAtTime(.001,now+.13);osc.start(now);osc.stop(now+.13);var o2=audioCtx.createOscillator();var g2=audioCtx.createGain();o2.connect(g2);g2.connect(audioCtx.destination);o2.type='sine';o2.frequency.setValueAtTime(bf*2,now);o2.frequency.exponentialRampToValueAtTime(ef*1.5,now+.07);g2.gain.setValueAtTime(.001,now);g2.gain.exponentialRampToValueAtTime(.02,now+.006);g2.gain.exponentialRampToValueAtTime(.001,now+.08);o2.start(now);o2.stop(now+.08)}
function playInvalid(){if(!audioCtx||!soundOn)return;var now=audioCtx.currentTime;var osc=audioCtx.createOscillator();var gain=audioCtx.createGain();osc.connect(gain);gain.connect(audioCtx.destination);osc.type='sine';osc.frequency.setValueAtTime(160,now);osc.frequency.exponentialRampToValueAtTime(100,now+.1);gain.gain.setValueAtTime(.001,now);gain.gain.exponentialRampToValueAtTime(.035,now+.01);gain.gain.exponentialRampToValueAtTime(.001,now+.1);osc.start(now);osc.stop(now+.1)}

function formatTime(ms){var ts=Math.floor(ms/1000);var min=Math.floor(ts/60);var sec=ts%60;var mil=ms%1000;return(min<10?'0':'')+min+':'+(sec<10?'0':'')+sec+'.'+(mil<100?'0':'')+(mil<10?'0':'')+mil}
function updateTimerDisplay(){if(gameStarted&&!gameFinished){timerElapsed=performance.now()-timerStart}timerEl.textContent=formatTime(Math.round(timerElapsed))}
function timerLoop(){updateTimerDisplay();if(gameStarted&&!gameFinished){timerRAF=requestAnimationFrame(timerLoop)}}

function getStorageKey(){return'jiulianhuan_'+TOTAL+'_'+(gameMode==='disassembly'?'dis':'asm')}
function loadRecords(){try{var d=localStorage.getItem(getStorageKey());return d?JSON.parse(d):[]}catch(e){return[]}}
function saveRecord(moves,timeMs){var records=loadRecords();records.push({moves:moves,time:Math.round(timeMs),date:Date.now()});records.sort(function(a,b){if(a.moves!==b.moves)return a.moves-b.moves;return a.time-b.time});if(records.length>10)records=records.slice(0,10);try{localStorage.setItem(getStorageKey(),JSON.stringify(records))}catch(e){}var rank=-1;for(var i=0;i<records.length;i++){if(records[i].moves===moves&&records[i].time===Math.round(timeMs)){rank=i;break}}return rank}
function renderRecords(){var records=loadRecords();var ml=gameMode==='disassembly'?'拆 解':'安 装';var tl=CN_NUM[TOTAL]||TOTAL;if(records.length===0){recordsContent.innerHTML='<h3>'+tl+'连环 · '+ml+' 记 录</h3><div class="no-records">暂无记录</div>';clearRecordsWrap.style.display='none';return}var html='<h3>'+tl+'连环 · '+ml+' 记 录</h3>';for(var i=0;i<records.length;i++){var r=records[i];var rt=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);html+='<div class="record-row"><span class="record-rank">'+rt+'</span><span class="record-steps">'+r.moves+' 步</span><span class="record-time">'+formatTime(r.time)+'</span></div>'}recordsContent.innerHTML=html;clearRecordsWrap.style.display=''}

function canToggle(idx){if(idx===0)return true;if(!rings[idx-1])return false;for(var i=0;i<idx-1;i++){if(rings[i])return false}return true}
function stateToKey(st){var k=0;for(var i=0;i<TOTAL;i++)k=k*2+(st[i]?1:0);return k}
function canToggleKey(key,idx){if(idx===0)return true;if(!((key>>(TOTAL-1-idx+1))&1))return false;for(var i=0;i<idx-1;i++){if((key>>(TOTAL-1-i))&1)return false}return true}
function toggleBit(key,idx){return key^(1<<(TOTAL-1-idx))}

function precomputeTables(){
var N=1<<TOTAL;
distDisassembly=new Int32Array(N);nextMoveDisassembly=new Int8Array(N);
distDisassembly.fill(-1);nextMoveDisassembly.fill(-1);
distDisassembly[0]=0;var queue=new Int32Array(N);var head=0,tail=0;queue[tail++]=0;
while(head<tail){var key=queue[head++];for(var i=0;i<TOTAL;i++){if(!canToggleKey(key,i))continue;var nk=toggleBit(key,i);if(distDisassembly[nk]===-1){distDisassembly[nk]=distDisassembly[key]+1;queue[tail++]=nk}}}
for(var key=1;key<N;key++){if(distDisassembly[key]<=0)continue;for(var i=0;i<TOTAL;i++){if(!canToggleKey(key,i))continue;var nk=toggleBit(key,i);if(distDisassembly[nk]===distDisassembly[key]-1){nextMoveDisassembly[key]=i;break}}}
distAssembly=new Int32Array(N);nextMoveAssembly=new Int8Array(N);
distAssembly.fill(-1);nextMoveAssembly.fill(-1);
distAssembly[N-1]=0;queue=new Int32Array(N);head=0;tail=0;queue[tail++]=N-1;
while(head<tail){var key=queue[head++];for(var i=0;i<TOTAL;i++){if(!canToggleKey(key,i))continue;var nk=toggleBit(key,i);if(distAssembly[nk]===-1){distAssembly[nk]=distAssembly[key]+1;queue[tail++]=nk}}}
for(var key=0;key<N-1;key++){if(distAssembly[key]<=0)continue;for(var i=0;i<TOTAL;i++){if(!canToggleKey(key,i))continue;var nk=toggleBit(key,i);if(distAssembly[nk]===distAssembly[key]-1){nextMoveAssembly[key]=i;break}}}
}

function getCurrentDist(){var key=stateToKey(rings);return gameMode==='disassembly'?distDisassembly[key]:distAssembly[key]}
function getCurrentNextMove(){var key=stateToKey(rings);return gameMode==='disassembly'?nextMoveDisassembly[key]:nextMoveAssembly[key]}
function updateRemainSteps(){var d=getCurrentDist();remainEl.textContent=d>=0?d:'?'}

function showHint(){if(solving||paused||gameFinished)return;var next=getCurrentNextMove();if(next<0)return;hintIdx=next;if(!hintAnimRunning){hintAnimRunning=true;hintAnimLoop()}if(hintTimer)clearTimeout(hintTimer);hintTimer=setTimeout(function(){hintIdx=-1;hintAnimRunning=false;draw()},2500)}
function hintAnimLoop(){if(hintIdx<0||!hintAnimRunning){hintAnimRunning=false;return}draw();requestAnimationFrame(hintAnimLoop)}
function togglePause(){if(gameFinished||!gameStarted)return;paused=!paused;pauseBtn.textContent=paused?'继续':'暂停';pauseOverlay.classList.toggle('show',paused);if(paused){pauseElapsed=timerElapsed;if(timerRAF)cancelAnimationFrame(timerRAF)}else{timerStart=performance.now()-pauseElapsed;timerRAF=requestAnimationFrame(timerLoop)}}
function toggleMode(){gameMode=gameMode==='disassembly'?'assembly':'disassembly';modeBtn.textContent=gameMode==='disassembly'?'切换安装':'切换拆解';modeTag.textContent=gameMode==='disassembly'?'拆解模式':'安装模式';resetGame()}

function computeStarRating(moves,optimal){if(moves<=optimal)return 3;if(moves<=optimal*1.2)return 2;return 1}

function toggleRing(idx,fromSolve){
initAudio();if(paused&&!fromSolve)return;
if(animating[idx]){ringY[idx]=animToY[idx];animating[idx]=false}
if(!canToggle(idx)){showInvalid(idx);playInvalid();return}
if(!fromSolve){if(!gameStarted&&!gameFinished)startTimer();stopSolve()}
var goingOn=!rings[idx];rings[idx]=goingOn;moves++;moveEl.textContent=moves;
moveHistory.push(idx);undoBtn.disabled=false;updateRemainSteps();
playBubble(goingOn);startAnimation(idx);
var won=gameMode==='disassembly'?rings.every(function(r){return!r}):rings.every(function(r){return r});
if(won){stopTimer();var ft=timerElapsed;var opt=optimalSteps(TOTAL);var rank=saveRecord(moves,ft);var stars=computeStarRating(moves,opt);
setTimeout(function(){winMovesEl.textContent=moves;winTimeEl.textContent=formatTime(Math.round(ft));
var st='';for(var s=0;s<3;s++)st+=s<stars?'★':'☆';starRatingEl.textContent=st;
starRatingEl.style.color=stars===3?'#ffd700':stars===2?'#c0c0c0':'#cd7f32';
winNewRecord.style.display=rank===0?'block':'none';winOverlay.classList.add('show');renderRecords()},ANIM_DUR+50)}
}

function undoMove(){if(moveHistory.length===0||solving||paused)return;var idx=moveHistory.pop();rings[idx]=!rings[idx];moves--;moveEl.textContent=moves;undoBtn.disabled=moveHistory.length===0;updateRemainSteps();startAnimation(idx)}
function showInvalid(idx){invalidIdx=idx;draw();if(invalidTimer)clearTimeout(invalidTimer);invalidTimer=setTimeout(function(){invalidIdx=-1;draw()},300)}
function buildSolutionPath(){var path=[];var cur=rings.slice();var maxSteps=optimalSteps(TOTAL)*2;for(var step=0;step<maxSteps;step++){var key=stateToKey(cur);var nm=gameMode==='disassembly'?nextMoveDisassembly[key]:nextMoveAssembly[key];if(nm<0)break;path.push(nm);cur[nm]=!cur[nm];var won=gameMode==='disassembly'?cur.every(function(r){return!r}):cur.every(function(r){return r});if(won)break}return path}
function startSolve(){if(solving){stopSolve();return}if(paused)return;var won=gameMode==='disassembly'?rings.every(function(r){return!r}):rings.every(function(r){return r});if(won)return;solving=true;solveBtn.textContent='停止';undoBtn.disabled=true;if(!gameStarted&&!gameFinished)startTimer();var solution=buildSolutionPath();if(solution.length===0){stopSolve();return}var step=0;function nextStep(){if(!solving||step>=solution.length){stopSolve();return}toggleRing(solution[step],true);step++;solveTimer=setTimeout(nextStep,ANIM_DUR+120)}nextStep()}

function drawCanvasBg(){
ctx.fillStyle=ctx.createLinearGradient(0,0,0,CANVAS_H);
ctx.fillStyle.addColorStop(0,sc.bg1);ctx.fillStyle.addColorStop(1,sc.bg2);
ctx.fillRect(0,0,CANVAS_W,CANVAS_H);ctx.strokeStyle=sc.decoLine;ctx.lineWidth=.5;
if(ringStyleType=='cartoon'){
for(var x=30;x<CANVAS_W-30;x+=50){ctx.beginPath();ctx.moveTo(x,CANVAS_H-5);ctx.quadraticCurveTo(x+12,CANVAS_H-12,x+25,CANVAS_H-5);ctx.stroke()}
}else if(ringStyleType=='bubble'){
var time=performance.now()*.0005;
for(var i=0;i<6;i++){var bx=100+i*140+Math.sin(time+i*1.3)*20;var by=30+Math.cos(time*.7+i*0.9)*15;var br=6+Math.sin(time+i)*3;ctx.beginPath();ctx.arc(bx,by,br,0,Math.PI*2);ctx.fillStyle='rgba(180,160,240,.03)';ctx.fill()}
}
}

function drawBeam(){
ctx.save();ctx.shadowColor=sc.beamSh;ctx.shadowBlur=8;ctx.shadowOffsetY=2;
var g=ctx.createLinearGradient(0,BEAM_Y,0,BEAM_Y+BEAM_H);
g.addColorStop(0,sc.beamG[0]);g.addColorStop(.5,sc.beamG[2]);g.addColorStop(1,sc.beamG[4]);
ctx.fillStyle=g;ctx.beginPath();
ctx.roundRect(BEAM_L,BEAM_Y,BEAM_R-BEAM_L,BEAM_H,3);ctx.fill();ctx.restore();
var lx=BEAM_L-4;ctx.save();ctx.beginPath();ctx.arc(lx-8,BEAM_CY,6,0,Math.PI*2);ctx.strokeStyle=sc.lRing;ctx.lineWidth=3;ctx.stroke();ctx.restore();
var rx=BEAM_R+2;ctx.beginPath();ctx.moveTo(rx,BEAM_CY-6);ctx.lineTo(rx+10,BEAM_CY);ctx.lineTo(rx,BEAM_CY+6);ctx.closePath();ctx.fillStyle=sc.tipG[0];ctx.fill();
drawEndCap(BEAM_L-3);drawEndCap(BEAM_R-5);
}

function drawEndCap(x){ctx.save();var g=ctx.createLinearGradient(0,BEAM_Y-3,0,BEAM_Y+BEAM_H+3);g.addColorStop(0,sc.capG[0]);g.addColorStop(1,sc.capG[2]);ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x,BEAM_Y-3,8,BEAM_H+6,2);ctx.fill();ctx.restore()}
function isStationaryOnBeam(i){return rings[i]&&!animating[i]&&Math.abs(ringY[i]-ON_Y)<2}

function drawStyledRing(x,y,isOn,isOnBeam){
var colors=isOn?sc.rOn:sc.rOff;var ow=sc.outlineW||0;var oc=sc.outlineC||'';
if(ringStyleType==='cartoon'){
ctx.beginPath();ctx.arc(x,y,R_RADIUS,0,Math.PI*2);ctx.strokeStyle=oc;ctx.lineWidth=R_BORDER+ow;ctx.stroke();
ctx.beginPath();ctx.arc(x,y,R_RADIUS,0,Math.PI*2);ctx.strokeStyle=colors[0];ctx.lineWidth=R_BORDER;ctx.stroke();
return}
if(ringStyleType==='bubble'){
ctx.save();ctx.globalAlpha=sc.bubbleAlpha||.55;ctx.beginPath();ctx.arc(x,y,R_RADIUS,0,Math.PI*2);
var gF=ctx.createLinearGradient(x,y-R_RADIUS,x,y+R_RADIUS);gF.addColorStop(0,colors[0]);gF.addColorStop(1,colors[2]||colors[0]);
ctx.strokeStyle=gF;ctx.lineWidth=R_BORDER;ctx.stroke();ctx.restore();
return}
if(ringStyleType==='paper'||ringStyleType==='glass'){
ctx.beginPath();ctx.arc(x,y,R_RADIUS,0,Math.PI*2);ctx.strokeStyle=colors[0];ctx.lineWidth=R_BORDER;ctx.stroke();
return}
ctx.save();ctx.shadowColor=sc.rOnSh;ctx.shadowBlur=4;ctx.beginPath();ctx.arc(x,y,R_RADIUS,0,Math.PI*2);
var gF=ctx.createLinearGradient(x,y-R_RADIUS,x,y+R_RADIUS);gF.addColorStop(0,colors[0]);gF.addColorStop(1,colors[3]||colors[0]);
ctx.strokeStyle=gF;ctx.lineWidth=R_BORDER;ctx.stroke();ctx.restore();
}

function drawOnBeamBehind(){
for(var i=0;i<TOTAL;i++){if(!isStationaryOnBeam(i))continue;ctx.save();ctx.globalAlpha=.25;ctx.beginPath();ctx.rect(RX[i]-R_RADIUS-R_BORDER-4,0,R_RADIUS+R_BORDER+4,CANVAS_H);ctx.clip();drawStyledRing(RX[i],ON_Y,true,false);ctx.restore()}
}
function drawOnBeamFront(){
for(var i=0;i<TOTAL;i++){if(!isStationaryOnBeam(i))continue;ctx.save();ctx.beginPath();ctx.rect(RX[i],0,R_RADIUS+R_BORDER+4,CANVAS_H);ctx.clip();drawStyledRing(RX[i],ON_Y,true,false);ctx.restore()}
}
function drawRod(i){var x=RX[i],yTop=BEAM_Y+BEAM_H,yBot=ringY[i]-R_RADIUS;if(yBot<=yTop)return;ctx.strokeStyle=sc.rodG[0];ctx.lineWidth=ROD_W;ctx.beginPath();ctx.moveTo(x,yTop);ctx.lineTo(x,yBot);ctx.stroke()}
function drawTransitRings(){for(var i=0;i<TOTAL;i++){if(isStationaryOnBeam(i))continue;drawRod(i);drawStyledRing(RX[i],ringY[i],rings[i],false)}}
function drawNumbers(){var fs=Math.max(8,Math.min(11,R_RADIUS*.55));ctx.font='bold '+fs+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';for(var i=0;i<TOTAL;i++){ctx.fillStyle=rings[i]?sc.numOn:sc.numOff;ctx.fillText(i+1,RX[i],ringY[i]+R_RADIUS+fs+3)}}
function drawRodDots(){
for(var i=0;i<TOTAL;i++){
var x=RX[i],y=BEAM_CY;var colors=rings[i]?sc.rOn:sc.rOff;
ctx.beginPath();ctx.arc(x,y,DOT_R,0,Math.PI*2);ctx.fillStyle=colors[0];ctx.fill();
if(canToggle(i)&&!animating[i]){ctx.beginPath();ctx.arc(x,y,DOT_R+3,0,Math.PI*2);ctx.strokeStyle=sc.glow;ctx.lineWidth=1.5;ctx.stroke()}
if(hintIdx===i&&canToggle(i)&&!animating[i]){var pulse=.4+.6*Math.abs(Math.sin(performance.now()/250));ctx.beginPath();ctx.arc(x,y,DOT_R+5,0,Math.PI*2);ctx.strokeStyle='rgba(255,215,0,'+pulse.toFixed(2)+')';ctx.lineWidth=2;ctx.stroke()}
}}
function drawHighlights(){
for(var i=0;i<TOTAL;i++){if(!canToggle(i)||animating[i])continue;ctx.beginPath();ctx.arc(RX[i],ringY[i],R_RADIUS+4,0,Math.PI*2);ctx.strokeStyle=sc.glow;ctx.lineWidth=1.5;ctx.stroke()}
if(hintIdx>=0&&hintIdx<TOTAL&&canToggle(hintIdx)&&!animating[hintIdx]){var pulse=.4+.6*Math.abs(Math.sin(performance.now()/250));ctx.beginPath();ctx.arc(RX[hintIdx],ringY[hintIdx],R_RADIUS+8,0,Math.PI*2);ctx.strokeStyle='rgba(255,215,0,'+pulse.toFixed(2)+')';ctx.lineWidth=2;ctx.stroke()}
if(hoverIdx>=0&&hoverIdx<TOTAL&&canToggle(hoverIdx)&&!animating[hoverIdx]){ctx.beginPath();ctx.arc(RX[hoverIdx],ringY[hoverIdx],R_RADIUS+5,0,Math.PI*2);ctx.strokeStyle=sc.hover;ctx.lineWidth=2;ctx.stroke()}
if(invalidIdx>=0&&invalidIdx<TOTAL){ctx.beginPath();ctx.arc(RX[invalidIdx],ringY[invalidIdx],R_RADIUS+5,0,Math.PI*2);ctx.strokeStyle=sc.invalid;ctx.lineWidth=2;ctx.stroke()}
}

function draw(){ctx.clearRect(0,0,CANVAS_W,CANVAS_H);drawCanvasBg();drawOnBeamBehind();drawBeam();drawOnBeamFront();drawTransitRings();drawRodDots();drawNumbers();drawHighlights()}
function mousePos(e){var r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*(CANVAS_W/r.width),y:(e.clientY-r.top)*(CANVAS_H/r.height)}}
function hitRing(mx,my){
for(var i=TOTAL-1;i>=0;i--){if(mx>=RX[i]-R_RADIUS-4&&mx<=RX[i]+R_RADIUS+4&&my>=ringY[i]-R_RADIUS-4&&my<=ringY[i]+R_RADIUS+4)return i}
if(my>=BEAM_Y-4&&my<=BEAM_Y+BEAM_H+4){for(var i=0;i<TOTAL;i++){if(Math.abs(mx-RX[i])<=R_SPACE/2)return i}}
return-1}

canvas.addEventListener('click',function(e){if(solving||paused)return;var p=mousePos(e);var idx=hitRing(p.x,p.y);if(idx>=0)toggleRing(idx,false)});
canvas.addEventListener('mousemove',function(e){var p=mousePos(e);var idx=hitRing(p.x,p.y);if(idx!==hoverIdx){hoverIdx=idx;canvas.style.cursor=solving||paused?'default':idx>=0&&canToggle(idx)&&!animating[idx]?'pointer':idx>=0?'not-allowed':'default';if(!animLoopRunning)draw()}});
canvas.addEventListener('mouseleave',function(){hoverIdx=-1;canvas.style.cursor='default';if(!animLoopRunning)draw()});

resetBtn.addEventListener('click',resetGame);
winResetBtn.addEventListener('click',resetGame);
undoBtn.addEventListener('click',undoMove);
solveBtn.addEventListener('click',startSolve);
helpBtn.addEventListener('click',function(){helpPanel.classList.toggle('open');helpBtn.textContent=helpPanel.classList.contains('open')?'收起':'规则'});
recordsBtn.addEventListener('click',function(){recordsPanel.classList.toggle('open');renderRecords();recordsBtn.textContent=recordsPanel.classList.contains('open')?'收起':'记录'});
soundBtn.addEventListener('click',function(){initAudio();soundOn=!soundOn;soundBtn.textContent=soundOn?'音效':'静音'});
hintBtn.addEventListener('click',showHint);
pauseBtn.addEventListener('click',togglePause);
modeBtn.addEventListener('click',toggleMode);
clearRecordsBtn.addEventListener('click',clearRecords);
ringSelect.addEventListener('change',function(){var n=parseInt(this.value);changeRingCount(n)});

document.addEventListener('keydown',function(e){
if(e.ctrlKey&&e.key==='z'){e.preventDefault();undoMove();return}
if(e.key>='1'&&e.key<='9'){var idx=parseInt(e.key)-1;if(idx<TOTAL&&!solving&&!paused)toggleRing(idx,false);return}
if(e.key==='h'||e.key==='H'){showHint();return}
if(e.key==='p'||e.key==='P'){togglePause();return}
});

requestAnimationFrame(function(){
computeLayout();setupCanvas();buildStyleBar();precomputeTables();
firstInit=true;resetGame();applyStyle(0);updateTitle();updateHelpOptimal();
});
window.addEventListener('resize',function(){setupCanvas();for(var i=0;i<TOTAL;i++){if(!animating[i])ringY[i]=rings[i]?ON_Y:OFF_Y}if(!animLoopRunning)draw()});
})();
</script>
</body>
</html>
