<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>九连环 - 中华传统益智游戏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--body);display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'SimSun','STSong','Songti SC',serif;transition:background .6s}
.game-container{width:calc(100% - 16px);max-width:1500px;background:linear-gradient(180deg,var(--bg1),var(--bg2));border:3px solid var(--border);border-radius:20px;padding:18px 0 22px;box-shadow:0 12px 80px rgba(0,0,0,.5),0 0 0 1px var(--border-inner),inset 0 1px 0 rgba(255,255,255,.08);position:relative;transition:all .6s;overflow:hidden}
.game-container::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:conic-gradient(from 0deg,transparent,var(--shimmer),transparent,transparent);animation:shimmer 8s linear infinite;opacity:.03;pointer-events:none}
@keyframes shimmer{to{transform:rotate(360deg)}}
.corner{position:absolute;width:28px;height:28px;pointer-events:none;opacity:.6;transition:border-color .6s}
.corner-tl{top:6px;left:6px;border-top:2px solid var(--corner);border-left:2px solid var(--corner);border-radius:6px 0 0 0}
.corner-tr{top:6px;right:6px;border-top:2px solid var(--corner);border-right:2px solid var(--corner);border-radius:0 6px 0 0}
.corner-bl{bottom:6px;left:6px;border-bottom:2px solid var(--corner);border-left:2px solid var(--corner);border-radius:0 0 0 6px}
.corner-br{bottom:6px;right:6px;border-bottom:2px solid var(--corner);border-right:2px solid var(--corner);border-radius:0 0 6px 0}
.title-area{text-align:center;margin-bottom:10px;position:relative}
.title-area h1{font-size:44px;color:var(--title);letter-spacing:24px;font-weight:900;text-shadow:0 2px 8px var(--title-sh),0 0 30px var(--title-glow);transition:color .6s}
.title-area .subtitle{font-size:13px;color:var(--sub);margin-top:2px;letter-spacing:6px;transition:color .6s}
.title-divider{width:180px;height:1px;margin:6px auto 0;background:linear-gradient(90deg,transparent,var(--divider),transparent);transition:background .6s}
.mode-tag{display:inline-block;font-size:11px;color:var(--mode-tx);padding:2px 12px;background:var(--mode-bg);border:1px solid var(--mode-bd);border-radius:12px;margin-left:8px;letter-spacing:3px;white-space:nowrap;vertical-align:middle;transition:all .6s}
.canvas-wrapper{display:flex;justify-content:center;margin:8px 0 0}
.canvas-frame{width:100%;border:2px solid var(--frame);border-radius:12px;overflow:hidden;box-shadow:inset 0 0 20px rgba(0,0,0,.15),0 4px 16px rgba(0,0,0,.2);position:relative;transition:border-color .6s}
.info-bar{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:12px;flex-wrap:wrap}
.info-item{font-size:14px;color:var(--move);letter-spacing:1px;padding:5px 16px;background:var(--move-bg);border-radius:8px;border:1px solid var(--move-bd);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:all .6s;white-space:nowrap}
.info-item span{color:var(--move-n);font-weight:bold;font-size:17px;font-variant-numeric:tabular-nums}
.controls{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.btn{padding:7px 16px;font-size:13px;font-family:'SimSun','STSong',serif;background:var(--btn-bg);color:var(--btn-tx);border:1px solid var(--btn-bd);border-radius:8px;cursor:pointer;letter-spacing:2px;transition:all .25s;user-select:none;box-shadow:0 2px 8px rgba(0,0,0,.15);position:relative;overflow:hidden}
.btn::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);transition:left .5s}
.btn:hover::after{left:100%}
.btn:hover{box-shadow:0 4px 16px rgba(0,0,0,.25),0 0 12px var(--btn-glow);transform:translateY(-1px)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.btn:disabled::after{display:none}
.ring-select-wrap{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--move);letter-spacing:1px}
.ring-select{padding:5px 10px;font-size:13px;font-family:'SimSun','STSong',serif;background:var(--move-bg);color:var(--move-n);border:1px solid var(--move-bd);border-radius:8px;cursor:pointer;letter-spacing:2px;outline:none;transition:all .3s;-webkit-appearance:none;-moz-appearance:none;appearance:none;min-width:60px;text-align:center}
.ring-select:hover{box-shadow:0 0 8px var(--btn-glow)}
.ring-select option{background:var(--bg1);color:var(--move-n)}
.style-bar{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.style-item{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;cursor:pointer;border:2px solid transparent;transition:all .3s;user-select:none;background:var(--style-bg)}
.style-item:hover{background:var(--style-hover);transform:translateY(-1px)}
.style-item.active{border-color:var(--style-active);background:var(--style-hover);box-shadow:0 0 12px var(--btn-glow)}
.style-dot{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.15);transition:transform .3s;flex-shrink:0;box-shadow:inset 0 -2px 4px rgba(0,0,0,.3),0 1px 3px rgba(0,0,0,.2)}
.style-item:hover .style-dot{transform:scale(1.15)}
.style-name{font-size:12px;color:var(--sub);letter-spacing:1px;white-space:nowrap;transition:color .6s}
.help-panel{max-height:0;overflow:hidden;transition:max-height .4s ease;margin-top:10px}
.help-panel.open{max-height:500px}
.help-content{background:var(--panel-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--panel-bd);border-radius:12px;padding:18px 24px;color:var(--panel-tx);line-height:1.9;transition:all .6s}
.help-content h3{color:var(--panel-tt);font-size:16px;margin-bottom:8px;letter-spacing:4px}
.help-content p{font-size:14px;margin-bottom:4px}
.help-content .rule{padding-left:12px;border-left:3px solid var(--panel-rl);margin:6px 0}
.records-panel{max-height:0;overflow:hidden;transition:max-height .4s ease;margin-top:10px}
.records-panel.open{max-height:500px}
.records-content{background:var(--panel-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--panel-bd);border-radius:12px;padding:18px 24px;transition:all .6s}
.records-content h3{color:var(--panel-tt);font-size:16px;margin-bottom:10px;letter-spacing:4px}
.record-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--move-bd);font-size:14px;color:var(--move)}
.record-row:last-child{border-bottom:none}
.record-rank{width:30px;font-weight:bold;color:var(--move-n)}
.record-steps{flex:1;text-align:center}
.record-time{flex:1;text-align:right;font-variant-numeric:tabular-nums}
.no-records{font-size:14px;color:var(--sub);text-align:center;padding:10px 0}
.pause-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:none;justify-content:center;align-items:center;font-size:30px;color:var(--title);letter-spacing:16px;font-family:'SimSun','STSong',serif;font-weight:bold;z-index:10;border-radius:10px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.pause-overlay.show{display:flex}
.win-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);justify-content:center;align-items:center;z-index:100;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.win-overlay.show{display:flex}
.win-box{background:linear-gradient(180deg,var(--bg1),var(--bg2));border:3px solid var(--win-bd);border-radius:20px;padding:40px 60px;text-align:center;box-shadow:0 0 80px rgba(0,0,0,.4),0 0 40px var(--btn-glow);position:relative;overflow:hidden}
.win-box::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:conic-gradient(from 0deg,transparent,var(--shimmer),transparent,transparent);animation:shimmer 6s linear infinite;opacity:.05;pointer-events:none}
.win-box h2{font-size:34px;color:var(--win-tt);letter-spacing:14px;margin-bottom:12px;text-shadow:0 2px 8px var(--title-sh)}
.win-box p{font-size:16px;color:var(--win-tx);margin-bottom:6px}
.win-box .btn{margin-top:18px}
.win-new-record{color:var(--move-n);font-size:17px;font-weight:bold;margin-top:8px;letter-spacing:3px}
.star-rating{font-size:32px;margin-bottom:10px;letter-spacing:8px}
.clear-btn-wrap{text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="game-container" id="gameContainer">
    <div class="corner corner-tl"></div><div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div><div class="corner corner-br"></div>
    <div class="title-area">
        <h1 id="titleText">九 连 环</h1>
        <p class="subtitle">中华传统益智游戏<span class="mode-tag" id="modeTag">拆解模式</span></p>
        <div class="title-divider"></div>
    </div>
    <div class="canvas-wrapper">
        <div class="canvas-frame">
            <canvas id="puzzle"></canvas>
            <div class="pause-overlay" id="pauseOverlay">已 暂 停</div>
        </div>
    </div>
    <div class="info-bar">
        <div class="info-item">步数：<span id="moveCount">0</span> / <span id="optimalSteps">341</span></div>
        <div class="info-item">剩余：<span id="remainSteps">341</span> 步</div>
        <div class="info-item">用时：<span id="timerDisplay">00:00.000</span></div>
    </div>
    <div class="controls">
        <div class="ring-select-wrap">
            <label for="ringSelect">切换环数</label>
            <select class="ring-select" id="ringSelect">
                <option value="7">7 环</option>
                <option value="9" selected>9 环</option>
                <option value="10">10 环</option>
                <option value="15">15 环</option>
                <option value="20">20 环</option>
            </select>
        </div>
        <button class="btn" id="resetBtn">重置</button>
        <button class="btn" id="undoBtn" disabled>撤销</button>
        <button class="btn" id="hintBtn">提示</button>
        <button class="btn" id="pauseBtn">暂停</button>
        <button class="btn" id="modeBtn">切换安装</button>
        <button class="btn" id="solveBtn">演示</button>
        <button class="btn" id="soundBtn">音效</button>
        <button class="btn" id="helpBtn">规则</button>
        <button class="btn" id="recordsBtn">记录</button>
    </div>
    <div class="style-bar" id="styleBar"></div>
    <div class="help-panel" id="helpPanel">
        <div class="help-content">
            <h3>游 戏 规 则</h3>
            <p class="rule">第 1 环随时可以上梁或下梁。</p>
            <p class="rule">第 n 环（n＞1）上梁或下梁的条件：第 n-1 环必须在梁上，且第 1 至 n-2 环必须全在下。</p>
            <p id="helpOptimal">目标：将梁上全部 9 个环取下（拆解模式）或装上（安装模式），最少需要 341 步。</p>
            <p>操作：鼠标点击圆环即可上梁或下梁，可操作的环会有光圈提示。</p>
            <p>快捷键：数字键操作对应环，H 提示，P 暂停，Ctrl+Z 撤销</p>
        </div>
    </div>
    <div class="records-panel" id="recordsPanel">
        <div class="records-content" id="recordsContent"></div>
        <div class="clear-btn-wrap" id="clearRecordsWrap"><button class="btn" id="clearRecordsBtn" style="font-size:12px;padding:5px 14px">清除记录</button></div>
    </div>
</div>
<div class="win-overlay" id="winOverlay">
    <div class="win-box">
        <h2>恭 喜 通 关</h2>
        <div class="star-rating" id="starRating"></div>
        <p>步数：<span id="winMoves">0</span></p>
        <p>用时：<span id="winTime">00:00.000</span></p>
        <div class="win-new-record" id="winNewRecord" style="display:none">新纪录！</div>
        <button class="btn" id="winResetBtn">再来一局</button>
    </div>
</div>

var RING_OPTIONS=[7,9,10,15,20];
var TOTAL=9;
var CANVAS_W=880,CANVAS_H=320;
var BEAM_Y=88,BEAM_H=22,BEAM_CY=BEAM_Y+BEAM_H/2;
var ON_Y=BEAM_CY,OFF_Y=222;
var ANIM_DUR=480;
var ROD_W=3;

var R_RADIUS,R_BORDER,R_SPACE,R_X0,BEAM_L,BEAM_R;
var RX=[];
var DOT_R=6;

function computeLayout(){
R_SPACE=Math.min(92,Math.floor((CANVAS_W-80)/Math.max(TOTAL-1,1)));
R_RADIUS=Math.max(10,Math.min(28,Math.floor(R_SPACE/2.8)));
R_BORDER=Math.max(3,Math.min(7,Math.floor(R_RADIUS/4)));

ON_Y=BEAM_CY;

ROD_W=Math.max(2,Math.min(4,Math.floor(R_RADIUS/7)));
var totalW=R_SPACE*(TOTAL-1);
R_X0=Math.floor((CANVAS_W-totalW)/2);
BEAM_L=R_X0-R_RADIUS-20;
BEAM_R=R_X0+totalW+R_RADIUS+20;
RX=[];
for(var i=0;i<TOTAL;i++)RX[i]=R_X0+i*R_SPACE;
}

function optimalSteps(n){
var a=1,b=2;
if(n===1)return 1;if(n===2)return 2;
for(var i=3;i<=n;i++){var c=b+2*a+1;a=b;b=c}
return b
}

function drawOnBeamBehind(){
for(var i=0;i<TOTAL;i++){

ctx.beginPath();ctx.rect(RX[i]-R_RADIUS-R_BORDER-5,0,R_RADIUS+R_BORDER+5,CANVAS_H);ctx.clip();
drawStyledRing(RX[i],ON_Y,true,false);
ctx.restore();
}}

function drawOnBeamFront(){
for(var i=0;i<TOTAL;i++){
if(!isStationaryOnBeam(i))continue;
ctx.save();
ctx.beginPath();ctx.rect(RX[i],0,R_RADIUS+R_BORDER+5,CANVAS_H);ctx.clip();
drawStyledRing(RX[i],ON_Y,true,false);

function drawRodDots(){
for(var i=0;i<TOTAL;i++){
var x=RX[i],y=BEAM_CY;
var isOn=rings[i];
var colors=isOn?sc.rOn:sc.rOff;
ctx.beginPath();ctx.arc(x,y,DOT_R,0,Math.PI*2);ctx.fillStyle=colors[0];ctx.fill();
ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1;ctx.stroke();

}}

function mousePos(e){var r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*(CANVAS_W/r.width),y:(e.clientY-r.top)*(CANVAS_H/r.height)}}
function hitRing(mx,my){
for(var i=TOTAL-1;i>=0;i--){var cy=ringY[i];var dx=mx-RX[i],dy=my-cy;if(dx*dx+dy*dy<=(R_RADIUS+8)*(R_RADIUS+8))return i}
var leftEdge=RX[0]-R_SPACE/2;
var rightEdge=RX[TOTAL-1]+R_SPACE/2;
if(mx>=leftEdge&&mx<=rightEdge){
var idx=Math.floor((mx-leftEdge)/R_SPACE);if(idx<0||idx>=TOTAL)return-1;
if(Math.abs(my-BEAM_CY)<=BEAM_H/2+10)return idx;
if(my>BEAM_Y+BEAM_H&&my<OFF_Y+R_RADIUS+10)return idx;
}
return-1}

canvas.addEventListener('click',function(e){if(solving||paused)return;var p=mousePos(e);var idx=hitRing(p.x,p.y);if(idx>=0)toggleRing(idx,false)});
canvas.addEventListener('mousemove',function(e){var p=mousePos(e);var idx=hitRing(p.x,p.y);if(idx!==hoverIdx){hoverIdx=idx;canvas.style.cursor=solving||paused?'default':idx>=0&&canToggle(idx)&&!animating[idx]?'pointer':idx>=0?'not-allowed':'default';if(!animLoopRunning)draw()}});
canvas.addEventListener('mouseleave',function(){hoverIdx=-1;canvas.style.cursor='default';if(!animLoopRunning)draw()});

resetBtn.addEventListener('click',resetGame);
winResetBtn.addEventListener('click',resetGame);
undoBtn.addEventListener('click',undoMove);
solveBtn.addEventListener('click',startSolve);
helpBtn.addEventListener('click',function(){helpPanel.classList.toggle('open');helpBtn.textContent=helpPanel.classList.contains('open')?'收起':'规则'});
recordsBtn.addEventListener('click',function(){recordsPanel.classList.toggle('open');renderRecords();recordsBtn.textContent=recordsPanel.classList.contains('open')?'收起':'记录'});
soundBtn.addEventListener('click',function(){initAudio();soundOn=!soundOn;soundBtn.textContent=soundOn?'音效':'静音'});
hintBtn.addEventListener('click',showHint);
pauseBtn.addEventListener('click',togglePause);
modeBtn.addEventListener('click',toggleMode);
clearRecordsBtn.addEventListener('click',clearRecords);

ringSelect.addEventListener('change',function(){var n=parseInt(this.value);changeRingCount(n)});

document.addEventListener('keydown',function(e){
if(e.ctrlKey&&e.key==='z'){e.preventDefault();undoMove();return}
if(e.key>='1'&&e.key<='9'){var idx=parseInt(e.key)-1;if(idx<TOTAL&&!solving&&!paused)toggleRing(idx,false);return}
if(e.key==='h'||e.key==='H'){showHint();return}
if(e.key==='p'||e.key==='P'){togglePause();return}
});

requestAnimationFrame(function(){
computeLayout();setupCanvas();
buildStyleBar();precomputeTables();
firstInit=true;resetGame();
applyStyle(0);
updateTitle();updateHelpOptimal();
});

window.addEventListener('resize',function(){setupCanvas();for(var i=0;i<TOTAL;i++){if(!animating[i])ringY[i]=rings[i]?ON_Y:OFF_Y}if(!animLoopRunning)draw()});

})();
</script>
</body>
</html>
